<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBot - E2E Master Test Report Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.8);
            --border-color: rgba(48, 54, 61, 0.8);
            --accent-green: #2ea44f;
            --text-main: #c9d1d9;
            --text-mute: #8b949e;
            --header-gradient: linear-gradient(135deg, #1f6feb, #238636);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2.5rem;
            min-height: 100vh;
        }
        
        header {
            background: var(--header-gradient);
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 80%);
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        
        header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.15);
        }
        
        .stat-card h3 {
            color: var(--text-mute);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        
        .stat-card p {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
        }
        
        .stat-card.pass p {
            color: #3fb950;
        }
        
        .stat-card.rate p {
            background: linear-gradient(45deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .search-bar, .filter-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }
        
        .search-bar {
            flex: 1;
            min-width: 250px;
        }
        
        .search-bar:focus, .filter-select:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.25);
        }
        
        .filter-select {
            min-width: 200px;
            cursor: pointer;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            margin-bottom: 1.5rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        th, td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        th {
            background-color: rgba(22, 27, 34, 0.9);
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }
        
        tr:hover td {
            background-color: rgba(56, 139, 253, 0.05);
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.pass {
            background-color: rgba(63, 185, 80, 0.15);
            color: #56d364;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
        
        .badge.fail {
            background-color: rgba(248, 81, 73, 0.15);
            color: #ffa198;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-mute);
        }
        
        .page-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .page-btn:hover:not(:disabled) {
            border-color: #58a6ff;
            background-color: rgba(56, 139, 253, 0.1);
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

    <header>

        <p>Comprehensive dashboard running 6 scaled test modules dynamically (1,800 test cases total)</p>
    </header>

    <div class="stats-grid">

        <div class="stat-card">

        </div>
        <div class="stat-card rate">
            <h3>Success Rate</h3>
            <p>100%</p>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search by test name or classname...">
        <select id="suite-filter" class="filter-select">
            <option value="ALL">All Test Suites</option>
            <option value="SeleniumWebsite">Selenium Website Tests</option>
            <option value="AppiumAndroid">Appium Android Tests</option>
            <option value="ApiUnit">Unit Tests — API</option>
            <option value="Validation">Validation Tests</option>
            <option value="Deployment">Deployment Status</option>
            <option value="Performance">Load Testing — Performance</option>
        </select>
    </div>

    <div class="table-container">

                    <th>Test Name</th>
                    <th>Duration</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Dynamically generated rows -->
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <button id="prev-btn" class="page-btn">Previous</button>
        <span id="page-info">Page 1 of 1</span>
        <button id="next-btn" class="page-btn">Next</button>
    </div>

    "duration": "0.330s",
    "status": "PASS"
  }
];
        let filteredCases = [...allCases];
        let currentPage = 1;
        const rowsPerPage = 20;

        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const suiteFilter = document.getElementById('suite-filter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfo = document.getElementById('page-info');

        function renderTable() {
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const pageCases = filteredCases.slice(startIndex, endIndex);

            tableBody.innerHTML = '';
            
            if (pageCases.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-mute);">No matching test cases found.</td></tr>';
                pageInfo.textContent = 'Page 0 of 0';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            pageCases.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:var(--text-mute);">#${c.id}</td>
                    <td><strong style="color:#ffffff;">${c.suite}</strong></td>
                    <td style="color:#58a6ff;">${c.classname}</td>
                    <td>${c.name}</td>
                    <td style="color:var(--text-mute);">${c.duration}</td>
                    <td><span class="badge ${c.status.toLowerCase()}">${c.status}</span></td>
                `;
                tableBody.appendChild(tr);
            });

            const totalPages = Math.ceil(filteredCases.length / rowsPerPage);
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;
        }

        function filterData() {
            const searchVal = searchInput.value.toLowerCase();
            const suiteVal = suiteFilter.value;

            filteredCases = allCases.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(searchVal) || c.classname.toLowerCase().includes(searchVal);
                const matchesSuite = suiteVal === 'ALL' || c.suite === suiteVal;
                return matchesSearch && matchesSuite;
            });

            currentPage = 1;
            renderTable();
        }

        searchInput.addEventListener('input', filterData);
        suiteFilter.addEventListener('change', filterData);

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredCases.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        renderTable();
    </script>
</body>
</html>
