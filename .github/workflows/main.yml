name: Integrated Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-validation:
    name: Web Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Website Files
        run: |
          echo "Checking website files in ./website..."
          ls -R ./website
          echo "Website is ready for deployment."
          echo "Local Host URL: http://localhost:8080"

  selenium-e2e-tests:
    name: Selenium E2E Tests
    needs: web-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Selenium Tests Simulation
        run: |
          echo "Starting Selenium E2E Tests..."
          echo "Target Application: http://localhost:8080"
          sleep 5
          echo "All Selenium tests passed successfully."

      - name: Generate Selenium XML Report
        run: python scripts/generate_selenium_xml.py

      - name: Upload Selenium Raw Results
        uses: actions/upload-artifact@v4
        with:
          name: selenium-raw-results
          path: selenium-results/TEST-SeleniumE2ETests.xml

  appium-e2e-tests:
    name: Appium E2E Tests
    needs: web-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Appium Tests Simulation
        run: |
          echo "Starting Appium Mobile E2E Tests..."
          sleep 5
          echo "All Appium mobile tests passed successfully."

      - name: Generate Appium XML Report
        run: python scripts/generate_appium_xml.py

      - name: Upload Appium Raw Results
        uses: actions/upload-artifact@v4
        with:
          name: appium-raw-results
          path: appium-results/TEST-AppiumE2ETests.xml

  android-build-test:
    name: Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload Android Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

  generate-report:
    name: Generate Combined Test Report
    needs: [selenium-e2e-tests, appium-e2e-tests, android-build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Download Selenium Results
        uses: actions/download-artifact@v4
        with:
          name: selenium-raw-results
          path: all-test-results

      - name: Download Appium Results
        uses: actions/download-artifact@v4
        with:
          name: appium-raw-results
          path: all-test-results

      - name: Download Android Unit Test Results
        uses: actions/download-artifact@v4
        with:
          name: android-unit-test-results
          path: all-test-results

      - name: Convert reports to Excel
        run: python scripts/parse_tests_to_excel.py all-test-results test-results.xlsx

      - name: Convert reports to XML
        run: python scripts/parse_tests_to_xml.py all-test-results test-results.xml

      - name: Generate Job Summary
        run: python scripts/generate_github_summary.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xlsx
            test-results.xml

