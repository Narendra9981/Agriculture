name: Upload Test Report Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: temporalio/setup-java@v2
        with:
          java-version: '17'

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Generate Job Summary
        if: always()
        run: python scripts/generate_github_summary.py

      - name: Upload HTML summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report-summary
          path: app/src/test/resources/test_report_summary_dark.html
