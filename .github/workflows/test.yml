name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Automated tests configuration - All test cases must pass
# Using latest stable actions versions for reliability
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Run unit tests
      run: ./gradlew test --stacktrace
    
    - name: Set up Python
      if: always()
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      if: always()
      run: pip install openpyxl
      
    - name: Convert reports to Excel
      if: always()
      run: python scripts/parse_tests_to_excel.py app/build/test-results test-results.xlsx
    
    - name: Generate Job Summary
      if: always()
      run: python scripts/generate_github_summary.py

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.xlsx
