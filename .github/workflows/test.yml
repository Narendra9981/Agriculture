name: AgriBot - Run All Tests & Upload Excel Reports

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  generate-all-reports:
    name: "Generate All 4 Excel Reports"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Create reports directory
        run: mkdir -p reports

      - name: Write report_lib.py
        run: |
          cat <<'PYEOF' > report_lib.py
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
          from openpyxl.utils import get_column_letter

          TITLE_FILL = PatternFill("solid", fgColor="1F4E79")
          HEADER_FILL = PatternFill("solid", fgColor="1F4E79")
          BAND_FILL = PatternFill("solid", fgColor="F2F2F2")
          WHITE_FILL = PatternFill("solid", fgColor="FFFFFFFF")
          PASS_FILL = PatternFill("solid", fgColor="C6EFCE")
          FAIL_FILL = PatternFill("solid", fgColor="FFC7CE")

          PASS_FONT = Font(name="Arial", size=10, bold=True, color="375623")
          FAIL_FONT = Font(name="Arial", size=10, bold=True, color="9C0006")

          THIN = Side(style="thin")
          BORDER = Border(left=THIN, right=THIN, top=THIN, bottom=THIN)


          def build_sheet(ws, title, headers, rows, col_widths):
              n_cols = len(headers)
              last_col_letter = get_column_letter(n_cols)

              ws.merge_cells(f"A1:{last_col_letter}1")
              ws["A1"] = title
              ws["A1"].font = Font(name="Arial", size=13, bold=True, color="FFFFFFFF")
              ws["A1"].fill = TITLE_FILL
              ws["A1"].alignment = Alignment(horizontal="center", vertical="center", wrap_text=True)
              ws.row_dimensions[1].height = 31.5

              for idx, h in enumerate(headers, start=1):
                  c = ws.cell(row=2, column=idx, value=h)
                  c.font = Font(name="Arial", size=11, bold=True, color="FFFFFFFF")
                  c.fill = HEADER_FILL
                  c.alignment = Alignment(horizontal="center", vertical="center", wrap_text=True)
                  c.border = BORDER

              result_col = headers.index("Result") + 1 if "Result" in headers else -1

              for r_idx, row_data in enumerate(rows, start=3):
                  band = WHITE_FILL if (r_idx % 2 == 1) else BAND_FILL
                  for c_idx, value in enumerate(row_data, start=1):
                      cell = ws.cell(row=r_idx, column=c_idx, value=value)
                      cell.border = BORDER
                      cell.alignment = Alignment(
                          horizontal="center" if c_idx in (1, result_col) else "left",
                          vertical="center",
                          wrap_text=True,
                      )
                      cell.font = Font(name="Arial", size=10)
                      cell.fill = band

                      if c_idx == result_col:
                          if str(value).upper() == "PASS":
                              cell.font = PASS_FONT
                              cell.fill = PASS_FILL
                          elif str(value).upper() == "FAIL":
                              cell.font = FAIL_FONT
                              cell.fill = FAIL_FILL

                  ws.row_dimensions[r_idx].height = 21.75

              for idx, width in enumerate(col_widths, start=1):
                  ws.column_dimensions[get_column_letter(idx)].width = width
          PYEOF
          echo "report_lib.py written"

