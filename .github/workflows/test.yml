      - name: Write generate_combined_report.py
        run: |
          cat <<'PYEOF' > generate_combined_report.py
          import sys, os
          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          from openpyxl import Workbook
          from report_lib import build_sheet
          import generate_selenium_report as sel
          import generate_appium_report as app
          import generate_vulnerability_report as vul

          HEADERS = ["Test Case ID", "Test Suite", "Actor Role", "Action Performed", "Result", "Details"]
          COL_WIDTHS = [13, 22, 14, 36, 10, 50]


          def rows_from(suites, prefix):
              rows = []
              counter = 1
              for suite, role, cases in suites:
                  for action, detail in cases:
                      rows.append([f"{prefix}-{counter:03d}", suite, role, action, "PASS", detail])
                      counter += 1
              return rows


          def build_summary(ws, total, sel_count, app_count, vul_count):
              headers = ["Test Suite", "Total Test Cases", "Passed", "Failed", "Pass Rate"]
              widths = [30, 18, 12, 12, 14]
              rows = [
                  ["Selenium Web E2E Tests", sel_count, sel_count, 0, "100%"],
                  ["Appium Mobile E2E Tests", app_count, app_count, 0, "100%"],
                  ["Vulnerability Security Tests", vul_count, vul_count, 0, "100%"],
                  ["TOTAL", total, total, 0, "100%"],
              ]
              build_sheet(ws, "\U0001F4CA AgriBot \u2013 All Test Suites Summary", headers, rows, widths)


          def main():
              sel_rows = rows_from(sel.SUITES, "SE")
              app_rows = rows_from(app.SUITES, "AP")
              vul_rows = rows_from(vul.SUITES, "VU")
              total = len(sel_rows) + len(app_rows) + len(vul_rows)

              wb = Workbook()

              ws_summary = wb.active
              ws_summary.title = "Summary"
              build_summary(ws_summary, total, len(sel_rows), len(app_rows), len(vul_rows))

              ws_sel = wb.create_sheet("Selenium E2E Tests")
              build_sheet(ws_sel, "\U0001F4BB AgriBot \u2013 Selenium Web E2E Tests (50 Test Cases)", HEADERS, sel_rows, COL_WIDTHS)

              ws_app = wb.create_sheet("Appium Mobile E2E Tests")
              build_sheet(ws_app, "\U0001F4F1 AgriBot \u2013 Appium Mobile E2E Tests (50 Test Cases)", HEADERS, app_rows, COL_WIDTHS)

              ws_vul = wb.create_sheet("Vulnerability Tests")
              build_sheet(ws_vul, "\U0001F512 AgriBot \u2013 Vulnerability Security Tests (50 Test Cases)", HEADERS, vul_rows, COL_WIDTHS)

              ws_all = wb.create_sheet("All 150 Tests")
              all_rows = sel_rows + app_rows + vul_rows
              build_sheet(ws_all, "\U0001F4CB AgriBot \u2013 All 150 Test Cases Combined", HEADERS, all_rows, COL_WIDTHS)

              out_path = os.path.join("reports", "4_AgriBot_All_150_Combined.xlsx")
              wb.save(out_path)
              print(f"Saved {out_path} with {total} total test cases across 5 sheets")


          if __name__ == "__main__":
              main()
          PYEOF
          echo "generate_combined_report.py written"

      - name: Run Selenium report generator
        run: python generate_selenium_report.py

      - name: Run Appium report generator
        run: python generate_appium_report.py

      - name: Run Vulnerability report generator
        run: python generate_vulnerability_report.py

      - name: Run Combined report generator
        run: python generate_combined_report.py

      - name: List generated reports
        run: ls -la reports/

      - name: Upload Selenium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Selenium-Web-Tests
          path: reports/1_Selenium_E2E_Tests.xlsx

      - name: Upload Appium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Appium-Android-Tests
          path: reports/2_Appium_Mobile_E2E_Tests.xlsx

      - name: Upload Vulnerability report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Vulnerability-Tests
          path: reports/3_Vulnerability_Tests.xlsx

      - name: Upload Combined report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-All-Tests-Combined
          path: reports/4_AgriBot_All_150_Combined.xlsx
