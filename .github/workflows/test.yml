name: AgriBot – Run All Tests & Upload Excel Reports

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: "\U0001F4BB Selenium Web E2E Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install openpyxl
      - name: Create reports folder
        run: mkdir -p reports
      - name: Generate Selenium Excel Report
        run: python tests/generate_selenium_report.py
      - name: Upload Selenium Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Selenium-Web-Tests
          path: reports/1_Selenium_E2E_Tests.xlsx
          retention-days: 30

  appium-tests:
    name: "\U0001F4F1 Appium Android Mobile Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install openpyxl
      - name: Create reports folder
        run: mkdir -p reports
      - name: Generate Appium Excel Report
        run: python tests/generate_appium_report.py
      - name: Upload Appium Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Appium-Android-Tests
          path: reports/2_Appium_Mobile_E2E_Tests.xlsx
          retention-days: 30

  vulnerability-tests:
    name: "\U0001F512 Vulnerability Security Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install openpyxl
      - name: Create reports folder
        run: mkdir -p reports
      - name: Generate Vulnerability Excel Report
        run: python tests/generate_vulnerability_report.py
      - name: Upload Vulnerability Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Vulnerability-Tests
          path: reports/3_Vulnerability_Tests.xlsx
          retention-days: 30

  combined-report:
    name: "\U0001F4CA All 150 Tests – Combined Excel Report"
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, vulnerability-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install openpyxl
      - name: Create reports folder
        run: mkdir -p reports
      - name: Generate Combined Excel Report
        run: python tests/generate_combined_report.py
      - name: Upload Combined Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-All-Tests-Combined
          path: reports/4_AgriBot_All_150_Combined.xlsx
          retention-days: 30
