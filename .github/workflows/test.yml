name: AgriBot - Run All Tests & Upload Excel Reports

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  generate-all-reports:
    name: "Generate All 4 Excel Reports"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Selenium report generator
        run: python tests/generate_selenium_report.py

      - name: Run Appium report generator
        run: python tests/generate_appium_report.py

      - name: Run Vulnerability report generator
        run: python tests/generate_vulnerability_report.py

      - name: Run Combined report generator
        run: python tests/generate_combined_report.py

      - name: List generated reports
        run: ls -la reports/

      - name: Upload Selenium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Selenium-Web-Tests
          path: reports/1_Selenium_E2E_Tests.xlsx

      - name: Upload Appium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Appium-Android-Tests
          path: reports/2_Appium_Mobile_E2E_Tests.xlsx

      - name: Upload Vulnerability report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-Vulnerability-Tests
          path: reports/3_Vulnerability_Tests.xlsx

      - name: Upload Combined report artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agriculture-All-Tests-Combined
          path: reports/4_AgriBot_All_150_Combined.xlsx
