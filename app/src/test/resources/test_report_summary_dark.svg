<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #0b0f14 }
      .card { fill: #0f1720; stroke: #1f2937; stroke-width:1 }
      .title { fill: #e6eef3; font-family: 'Segoe UI', Roboto, Arial; font-size:24px; font-weight:700 }
      .meta { fill: #94a3b8; font-size:14px }
      .table-header { fill: #a8bcc9; font-weight:700; font-size:13px }
      .table-cell { fill: #dbe9ef; font-size:13px }
      .small { fill: #94a3b8; font-size:12px }
      .pass { fill: #66ff99; font-weight:700 }
      .box { fill: #071018; stroke:#14202a }
    ]]></style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>
  <g transform="translate(40,30)">
    <rect class="card" x="0" y="0" width="1120" height="740" rx="12"/>
    <g transform="translate(24,24)">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="url(#grad)"/>
      <text x="72" y="22" class="title">A2ZEE E2E Test Suite Summary</text>
      <text x="72" y="46" class="meta">Here is the real-time breakdown of the Selenium automated test run</text>

      <!-- Stats -->
      <g transform="translate(0,70)">
        <g transform="translate(0,0)">
          <rect class="box" x="0" y="0" width="680" height="100" rx="8"/>
          <text x="18" y="28" class="small">2 tests &nbsp; • &nbsp; 0 failures &nbsp; • &nbsp; 0 skipped</text>
          <g transform="translate(520,12)">
            <rect x="0" y="0" width="160" height="68" rx="8" fill="#052616" stroke="#134a34"/>
            <text x="20" y="38" class="title" style="font-size:22px;fill:#66ff99">100%</text>
            <text x="20" y="56" class="small">successful</text>
          </g>
        </g>

        <!-- Table -->
        <g transform="translate(0,120)">
          <rect x="0" y="0" width="1040" height="420" fill="#071018" stroke="#0b1116" rx="8"/>
          <!-- Header -->
          <g transform="translate(12,12)">
            <text x="12" y="22" class="table-header">Test Suite</text>
            <text x="200" y="22" class="table-header">Actor Role</text>
            <text x="340" y="22" class="table-header">Action Performed</text>
            <text x="640" y="22" class="table-header">Result</text>
            <text x="720" y="22" class="table-header">Details</text>

            <!-- Rows -->
            <g transform="translate(0,28)">
              <text x="12" y="36" class="table-cell">Registration</text>
              <text x="200" y="36" class="table-cell">Admin</text>
              <text x="340" y="36" class="table-cell">Start Register</text>
              <text x="640" y="36" class="pass">PASS</text>
              <text x="720" y="36" class="small">Admin account registered successfully</text>

              <text x="12" y="72" class="table-cell">Product Listing</text>
              <text x="200" y="72" class="table-cell">Seller</text>
              <text x="340" y="72" class="table-cell">List Product</text>
              <text x="640" y="72" class="pass">PASS</text>
              <text x="720" y="72" class="small">Product E2E Sprouts 1781238212403 listed (pending approval)</text>

              <!-- Additional rows can be appended similarly -->
            </g>
          </g>
        </g>

        <text x="0" y="560" class="small">Generated as a dark-themed sample HTML summary to match GitHub Actions artifact previews.</text>
      </g>
    </g>
  </g>
</svg>